services:
  - type: web
    name: smart-schedule-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-schedule-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://smart-schedule-frontend.vercel.app
      - key: AGENT_PROVIDER
        value: offline
    healthCheckPath: /api/v1/health

databases:
  - name: smart-schedule-db
    databaseName: smart_schedule_prod
    plan: free
    postgresMajorVersion: 16

version: '3.9'

services:
  api:
    build: .
    container_name: smart-schedule-api
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: sqlite:///./smart_schedule.db
      SECRET_KEY: change-me-to-a-strong-random-key
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AGENT_PROVIDER: offline
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
